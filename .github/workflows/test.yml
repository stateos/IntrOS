name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

env:
  ARM_GCC_VERSION: 14.3.rel1

jobs:
  test:
    name: ${{matrix.name}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: build test
          cmake: true
          run: |
            cmake -S. -Bbuild -GNinja
            cmake --build build -v
        - name: example test
          run: bash ./.example-test.sh
    steps:
    - name: checkout repository
      uses: actions/checkout@v7
    - name: checkout submodules
      run: git submodule update --init --remote --recursive
    - name: install dependencies
      if: matrix.cmake
      run: |
        sudo apt-get -y -qq update
        sudo apt-get -y -qq install cmake ninja-build
    - name: install arm-none-eabi-gcc
      run: |
        ARM_GCC=arm-gnu-toolchain-$ARM_GCC_VERSION-x86_64-arm-none-eabi
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/$ARM_GCC_VERSION/binrel/$ARM_GCC.tar.xz
        tar -xf $ARM_GCC.tar.xz
        echo "${{github.workspace}}/$ARM_GCC/bin" >> $GITHUB_PATH
    - name: check arm-none-eabi-gcc version
      run: arm-none-eabi-gcc -v
    - name: make test
      run: ${{matrix.run}}
